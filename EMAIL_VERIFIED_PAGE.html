<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WildGuard Email Verified</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eaf7ef; font-family: Arial, sans-serif; color: #123d2a; }
    main { width: min(88%, 430px); padding: 38px 28px; text-align: center; background: white; border-radius: 24px; box-shadow: 0 12px 35px #176b4325; }
    .check { width: 76px; height: 76px; margin: auto; display: grid; place-items: center; border-radius: 50%; background: #176b43; color: white; font-size: 44px; }
    h1 { margin: 22px 0 10px; }
    p { color: #557064; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <div class="check">✓</div>
    <h1>You're verified</h1>
    <p>Your WildGuard email is verified. Return to the WildGuard app and tap <strong>I've verified</strong>.</p>
  </main>
</body>
</html>
